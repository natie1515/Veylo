name: build server arm64

# Compila el servidor nativo (tarball fluxer-*-linux-arm64.tar.zst) con el mismo
# Dockerfile del proyecto, descarga las librerías del sistema que normalmente
# se instalan con apt (para poder correr sin root) y publica todo en un Release.
#
# Uso: pestaña Actions -> "build server arm64" -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: apply Veylo patch (si veylo-patch.mjs está en la raiz del repo)
        if: hashFiles('veylo-patch.mjs') != ''
        run: |
          node veylo-patch.mjs \
            --domain bot1.hidenplay.net \
            --name Veylo \
            --releases "https://github.com/${{ github.repository }}/releases"

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: compute version
        run: |
          hms="$(date -u +%H%M%S)"
          echo "VERSION=$(date -u +%Y).$(date -u +%-m%d).$((10#$hms))" >> "$GITHUB_ENV"

      - name: build server tarball
        run: |
          docker buildx build \
            --target export \
            -f packaging/monolith/Dockerfile \
            --build-arg PROFILE=release-fast \
            --build-arg BUILD_VERSION="$VERSION" \
            --output type=local,dest=out \
            .
          ls -lh out

      - name: collect runtime libraries (no root needed later)
        run: |
          mkdir -p debs vendor
          docker run --rm \
            -v "$PWD/packaging/runtime-packages:/rp:ro" \
            -v "$PWD/debs:/out" \
            debian:trixie-slim bash -euxc '
              apt-get update
              pkgs="$(grep -v "^#" /rp | tr "\n" " ")"
              apt-get install -y --no-install-recommends --download-only \
                -o Dir::Cache::archives=/out $pkgs
            '
          for deb in debs/*.deb; do dpkg-deb -x "$deb" vendor/; done
          tar -C vendor -czf out/vendor-linux-arm64.tar.gz .
          ls -lh out

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "server-arm64-$VERSION" \
            out/*.tar.zst out/SHA256SUMS out/vendor-linux-arm64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "server arm64 $VERSION" \
            --notes "Servidor nativo para linux arm64 y librerias de runtime extraidas."
