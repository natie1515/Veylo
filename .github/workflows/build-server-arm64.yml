name: Compilar servidor Veylo amd64

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Dominio público, sin https ni rutas
        default: veylo.sbs
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar parche de Veylo si está en el repo
        if: hashFiles('veylo-patch.mjs') != ''
        env:
          DOMAIN: ${{ inputs.domain }}
        run: node veylo-patch.mjs --domain "$DOMAIN" --name Veylo --releases "https://github.com/$GITHUB_REPOSITORY/releases"

      - uses: docker/setup-buildx-action@v3

      - name: Compilar para Debian x86_64
        run: |
          hms="$(date -u +%H%M%S)"
          version="$(date -u +%Y).$(date -u +%-m%d).$((10#$hms))"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --target export \
            -f packaging/monolith/Dockerfile \
            --build-arg PROFILE=release-fast \
            --build-arg CARGO_BUILD_JOBS=2 \
            --build-arg BUILD_VERSION="$version" \
            --output type=local,dest=out .
          test -s "out/fluxer-$version-linux-amd64.tar.zst"
          (cd out && sha256sum -c SHA256SUMS)
          cp packaging/install.sh out/install.sh

      - name: Publicar paquete e instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "server-amd64-$VERSION" \
            "out/fluxer-$VERSION-linux-amd64.tar.zst" out/SHA256SUMS out/install.sh \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "Veylo servidor amd64 $VERSION"
