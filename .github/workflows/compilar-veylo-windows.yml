name: Compilar Veylo para Windows

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Dominio de tu instancia (sin https://)
        required: true
        default: veylo.sbs

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      BUILD_CHANNEL: stable
      BUILD_VERSION: 1.0.${{ github.run_number }}
      ELECTRON_ARCH: x64
      FLUXER_OFFLINE: "1"
      FLUXER_MODULES: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: --max-old-space-size=8192
    defaults:
      run:
        shell: bash

    steps:
      - name: Descargar código con saltos LF
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26

      - uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9
        with:
          arch: amd64

      - name: Preparar herramientas
        run: |
          git config --global core.longpaths true
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown x86_64-pc-windows-msvc
          npm install --global pnpm@11.27.0

      - name: Configurar instancia y nombre
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          domain = os.environ["DOMAIN"].strip().lower()
          if len(domain) > 253 or not re.fullmatch(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", domain):
              raise SystemExit("Escribe solo el dominio, sin https:// ni rutas.")

          def replace(path, edits):
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              for old, new in edits:
                  if source.count(old) != 1:
                      raise SystemExit(f"No se encontró un ajuste único en {path}: {old}")
                  source = source.replace(old, new, 1)
              file.write_bytes(source.encode("utf-8"))

          replace("fluxer_desktop/src/main/DesktopRuntimeDiscovery.ts", [
              ("return getLaunchInstanceEndpointOverride();",
               f"return getLaunchInstanceEndpointOverride() ?? 'https://{domain}/api';"),
          ])
          replace("fluxer_app/src/features/auth/flow/AuthRuntimeTargetBoundary.tsx", [
              ("AuthRuntimeTarget.forInstanceSelection(snapshot)",
               "snapshot === null ? AuthRuntimeTarget.forInstanceSelection() : AuthRuntimeTarget.forFixedInstance(snapshot)"),
          ])
          replace("fluxer_desktop/src/common/DesktopIdentity.ts", [
              ("stable: 'Fluxer',", "stable: 'Veylo',"),
              ("stable: 'Fluxer.Fluxer',", "stable: 'Veylo.Veylo',"),
          ])
          replace("fluxer_desktop/electron-builder.config.cjs", [
              ("productName: 'Fluxer',", "productName: 'Veylo',"),
              ("artifactProductName: 'Fluxer',", "artifactProductName: 'Veylo',"),
              ("appId: 'app.fluxer',", "appId: 'net.hidenplay.veylo',"),
              ("target: winTargets,", """target: [{target: 'nsis', arch: ['x64']}],
              signAndEditExecutable: false,"""),
              ("\n\tlinux: {\n\t\ticon:", "\n\tnsis: {artifactName: 'Veylo-Setup.exe'},\n\tlinux: {\n\t\ticon:"),
          ])
          PY

      - name: Ajustar el editor de avatar de Veylo
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("fluxer_app/src/features")

          def patch(path, edits):
              file = root / path
              source = file.read_text(encoding="utf-8")
              for old, new in edits:
                  if source.count(old) != 1:
                      raise SystemExit(f"No se encontró un ajuste único en {path}: {old}")
                  source = source.replace(old, new, 1)
              file.write_bytes(source.encode("utf-8"))

          patch("user/components/modals/tabs/my_profile_tab/AvatarUploader.tsx", [
              ("assetType={AssetType.AVATAR}", "assetType={AssetType.AVATAR}\n\t\t\t\t\t\tallowFullAvatar={!animated}"),
          ])
          patch("expressions/components/modals/AssetCropModal.tsx", [
              ("[AssetType.AVATAR]: {\n\t\taspectRatio: 1,\n\t\tcropShape: 'round',",
               "[AssetType.AVATAR]: {\n\t\taspectRatio: 1,\n\t\tcropShape: 'rect',"),
              ("\tonSkip?: () => void;", "\tonSkip?: () => void;\n\tallowFullAvatar?: boolean;"),
              ("({imageUrl, assetType, onCropComplete, onSkip})",
               "({imageUrl, assetType, onCropComplete, onSkip, allowFullAvatar})"),
              ("onSkip={onSkip}", "onSkip={allowFullAvatar ? undefined : onSkip}\n\t\t\t\tallowFullAvatar={allowFullAvatar}"),
          ])
          patch("messaging/components/modals/ImageCropModal.tsx", [
              ("\tonSkip?: () => void;", "\tonSkip?: () => void;\n\tallowFullAvatar?: boolean;"),
              ("\t\tonSkip,\n\t\ttitle,", "\t\tonSkip,\n\t\tallowFullAvatar = false,\n\t\ttitle,"),
              ("async function exportStaticImage(", """async function exportFullAvatar(
            image: HTMLImageElement,
            maxWidth: number,
            maxHeight: number,
            maxBytes: number,
          ): Promise<Blob> {
            const side = Math.min(512, maxWidth, maxHeight);
            const canvas = document.createElement('canvas');
            canvas.width = side;
            canvas.height = side;
            const ctx = canvas.getContext('2d');
            if (!ctx) throw new Error('Failed to get canvas context');
            const scale = (side - 4) / Math.hypot(image.naturalWidth, image.naturalHeight);
            const width = image.naturalWidth * scale;
            const height = image.naturalHeight * scale;
            ctx.drawImage(image, (side - width) / 2, (side - height) / 2, width, height);
            const blob = await new Promise<Blob>((resolve, reject) => {
              canvas.toBlob((result) => {
                if (result) resolve(result);
                else reject(new Error('Canvas toBlob failed'));
              }, 'image/png');
            });
            if (blob.size > maxBytes) throw new CropSizeLimitError(blob.size, maxBytes);
            return blob;
          }

          async function exportStaticImage("""),
              ("const handleSave = useCallback(async () => {", "const handleSave = useCallback(async (fullAvatar = false) => {"),
              ("\t\t\t\t!hasEdits &&", "\t\t\t\t!fullAvatar &&\n\t\t\t\t!hasEdits &&"),
              ("\t\t\t\t\tinspected.animated && isAnimatedCropSourceFormat(inspected.format)",
               "\t\t\t\t\tfullAvatar\n\t\t\t\t\t\t? await exportFullAvatar(img, maxWidth, maxHeight, sizeLimitBytes)\n\t\t\t\t\t\t: inspected.animated && isAnimatedCropSourceFormat(inspected.format)"),
              ("onClick={handleSave}", "onClick={() => void handleSave()}"),
              ("\t\t\t\t\t{onSkip && isSkipAllowed && (", """          {allowFullAvatar && (
                      <Button
                        variant="secondary"
                        onClick={() => void handleSave(true)}
                        disabled={exportDisabled || !displayDimensions}
                      >
                        {i18n.locale.startsWith('es') ? 'Usar foto completa' : 'Use full photo'}
                      </Button>
                    )}
                    {onSkip && isSkipAllowed && ("""),
          ])
          PY

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Normalizar los CSS que valida codegen
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("fluxer_app/src/features/app/components")
          for relative in (
              "skeleton/GuildRailSkeleton.module.css",
              "layout/GuildsLayout.module.css",
          ):
              file = root / relative
              original = file.read_bytes()
              normalized = original.replace(b"\r\n", b"\n")
              if normalized != original:
                  file.write_bytes(normalized)
                  print(f"{relative}: CRLF convertido a LF")
              else:
                  print(f"{relative}: sin saltos CRLF")
          PY

      - name: Adaptar el comando del renderer a Windows
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path

          file = Path("fluxer_app/package.json")
          package = json.loads(file.read_text(encoding="utf-8"))
          scripts = package["scripts"]
          expected = "FLUXER_DESKTOP_RENDERER=true rspack build --mode production"
          if scripts.get("build:renderer") != expected:
              raise SystemExit("El comando build:renderer cambió. Revisa fluxer_app/package.json.")
          scripts["build:renderer"] = 'set "FLUXER_DESKTOP_RENDERER=true" && rspack build --mode production'
          file.write_bytes((json.dumps(package, ensure_ascii=False, indent=2) + "\n").encode("utf-8"))
          PYTHON

      - name: Compilar el cliente de escritorio
        shell: pwsh
        working-directory: fluxer_desktop
        run: |
          $toolBin = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64'
          $linker = Join-Path $toolBin 'link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "No se encontró el enlazador de Visual Studio en $linker"
          }
          $env:Path = "$toolBin;$env:Path"
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = $linker
          Write-Host "Enlazador MSVC: $linker"
          pnpm run build

      - name: Generar instalador Windows x64
        working-directory: fluxer_desktop
        run: pnpm exec electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: Veylo-Windows-x64
          path: fluxer_desktop/dist-electron/Veylo-Setup.exe
          if-no-files-found: error
